version: '3.8'

networks:
  microservices-net:
    driver: bridge

services:
  # 1. Keycloak - наш сервис аутентификации
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_PROXY: edge
    volumes:
      - ./docker-configs/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json
      - ./docker-configs/keycloak/themes:/opt/keycloak/themes
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. PostgreSQL для Keycloak
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net

  # 3. API Gateway (пока простой nginx)
  gateway:
    image: nginx:alpine
    container_name: gateway
    volumes:
      - ./docker-configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker-configs/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - microservices-net

  # 4. Redis для кэширования токенов и сессий
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices-net

  # 5. Adminer для просмотра БД (опционально)
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    networks:
      - microservices-net

volumes:
  postgres_data:
